<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Web Engineer | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="hud-cursor-wrapper">
      <div class="hud-cursor-dot"></div>
      <div class="hud-cursor-ring">
        <span class="hud-cursor-label"></span>
      </div>
    </div>

    <header class="navbar">
      <a href="#" class="navbar-brand" data-cursor="hover">
        <span class="brand-dr4co">
          <span>&lt;</span>DR4CO<span>/&gt;</span>
        </span>
        <span class="navbar-brand-badge">SYS.v2</span>
      </a>

      <nav>
        <ul class="navbar-links">
          <li>
            <a href="#experience" class="navbar-link" data-cursor="hover"
              >Experiência</a
            >
          </li>
          <li>
            <a href="#projects" class="navbar-link" data-cursor="hover"
              >Projetos</a
            >
          </li>
          <li>
            <a href="#stack" class="navbar-link" data-cursor="hover">Stack</a>
          </li>
          <li>
            <a href="#contact" class="navbar-link" data-cursor="hover"
              >Contato</a
            >
          </li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <button class="lang-selector" data-cursor="hover">[ PT-BR ]</button>
      </div>
    </header>

    <main id="app" class="smooth-scroll-wrapper">
      <section
        style="
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 1rem;
          padding: 2rem;
          text-align: center;
        "
      >
        <h1
          style="
            font-family: var(--font-mono);
            color: var(--accent-cyan);
            font-size: 1.2rem;
            letter-spacing: 0.2em;
          "
        >
          [ PHASE 1: CORE SYSTEM ONLINE ]
        </h1>
        <p
          style="color: var(--text-muted); font-size: 0.9rem; max-width: 500px"
        >
          Passe o mouse no botão abaixo e role a página para testar.
        </p>
        <button
          style="
            padding: 14px 28px;
            border: 1px solid var(--border-tactical);
            color: var(--text-primary);
            font-family: var(--font-mono);
            margin-top: 1rem;
            background: var(--bg-surface);
          "
          data-cursor="hover"
        >
          TESTAR HUD CURSOR
        </button>
      </section>

      <section
        style="
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 1rem;
          border-top: 1px solid var(--border-tactical);
        "
      >
        <h2
          style="
            font-family: var(--font-mono);
            color: var(--accent-amber);
            font-size: 1.1rem;
          "
        >
          [ LENIS SMOOTH SCROLL OK ]
        </h2>
        <p style="color: var(--text-muted); font-size: 0.9rem">
          Se você chegou até aqui rodando o mouse, o scroll suave está 100%
          ativo!
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
